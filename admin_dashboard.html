<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Materchild Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm py-3">
        <div class="container">
            <span class="navbar-brand fw-bold d-flex align-items-center gap-2">
                <i class="ri-shield-flash-line text-warning"></i> Materchild Portal Administrativo
            </span>
            <button id="btn-logout-admin" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-5" style="border-radius: 16px;">
                    <h2 class="fw-bold mb-2 text-dark">Ingesta de Datos Clínicos</h2>
                    <p class="text-muted">Cargue el archivo consolidado del Dataset de Riesgo Materno (formato .csv) para poblar la plataforma.</p>
                    
                    <hr class="my-4 text-muted opacity-25">

                    <form id="admin-upload-form" class="mt-2">
                        <div class="mb-4 p-4 border border-2 border-dashed text-center bg-light" style="border-style: dashed !important; border-radius: 12px; border-color: #cbd5e1 !important;">
                            <i class="ri-file-upload-line text-muted display-4 d-block mb-3"></i>
                            <label class="form-label fw-semibold text-dark d-block mb-2">Seleccione el archivo .csv del Dataset</label>
                            <input type="file" id="csv-file" class="form-control bg-white mx-auto" accept=".csv" required style="max-width: 350px;">
                            <div class="form-text mt-2 small text-muted">El archivo debe usar punto y coma (;) como separador de columnas.</div>
                        </div>

                        <button type="submit" id="btn-upload-csv" class="btn btn-primary w-100 py-3 fw-semibold d-flex justify-content-center align-items-center gap-2" style="border-radius: 12px;">
                            Procesar e Insertar en Base de Datos
                            <i class="ri-database-2-line"></i>
                        </button>
                    </form>

                    <div id="upload-status" class="mt-4 d-none alert" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
