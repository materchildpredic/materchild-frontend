<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materchild Predic - Verificar Identidad</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Mantenemos tus estilos específicos para las cajitas del código OTP */
        .code-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin: 24px 0;
        }
        
        .code-input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-family: var(--font-display);
            font-weight: 600;
            background-color: var(--surface-container-low);
            border: 1px solid var(--ghost-border);
            border-radius: 12px;
            color: var(--on-surface);
            outline: none;
            transition: all 0.2s ease;
        }
        
        .code-input:focus {
            background-color: var(--surface-container-lowest);
            border: 1px solid var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ghost);
        }

        .code-separator {
            color: var(--outline-variant);
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center p-3 p-md-4" style="background-color: var(--surface);">
        
        <div class="text-center mb-4">
            <img src="assets/logo.png" alt="Materchild Predic Logo" class="mb-2" style="height: 100px;" onerror="this.style.display='none'">
            <div class="fw-bold text-muted" style="letter-spacing: 0.1em; font-size: 0.85rem;">SALUD MATERNO INFANTIL</div>
        </div>

        <div class="card border-0 shadow-lg w-100" style="max-width: 460px; border-radius: 24px;">
            <div class="card-body p-4 p-md-5">
                
                <h2 class="h3 fw-bold mb-3 text-center" style="color: var(--on-surface);">Verifica tu identidad</h2>
                <p class="text-muted mb-4" style="line-height: 1.6;">
                    Hemos enviado un código de seguridad de 6 dígitos a su correo electrónico registrado. Por favor, ingréselo a continuación.
                </p>

                <form id="verify-form">
                    <label class="form-label fw-semibold text-dark">Código de acceso</label>
                    
                    <div class="code-inputs">
                        <input type="text" class="code-input" maxlength="1" placeholder="0">
                        <input type="text" class="code-input" maxlength="1" placeholder="0">
                        <input type="text" class="code-input" maxlength="1" placeholder="0">
                        <span class="code-separator">-</span>
                        <input type="text" class="code-input" maxlength="1" placeholder="0">
                        <input type="text" class="code-input" maxlength="1" placeholder="0">
                        <input type="text" class="code-input" maxlength="1" placeholder="0">
                    </div>

                    <button type="submit" id="btn-verify" class="btn btn-primary w-100 py-3 mt-2 fw-semibold text-white d-flex justify-content-center align-items-center gap-2" style="background-color: var(--primary); border: none; border-radius: 12px; font-size: 1rem;">
                        Verificar e Ingresar
                        <i class="ri-login-box-line"></i>
                    </button>

                    <div class="text-center mt-4">
                        <span class="text-muted small">¿No recibiste el código?</span>
                        <button type="button" id="btn-resend" class="btn btn-link text-decoration-none fw-medium p-0 ms-1" style="color: var(--primary);">Reenviar código</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-5">
            <p class="text-muted small mb-2">© 2026 Materchild Predic. Todos los derechos reservados.</p>
        </div>
        
    </div>
    <script src="js/main.js"></script>
    <script>
        const inputs = document.querySelectorAll('.code-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Si escribe un número y no es el último, saltar al siguiente
                if (e.target.value.length > 0 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                // Si presiona borrar y está vacío, regresar al anterior
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
